# The language file name in plugins/EpochMarket/lang, without the .yml suffix.
default-language: zh_CN

# A Java timezone ID. Daily limits reset when this zone enters a new local date.
reset-timezone: Asia/Shanghai

database:
  file: market.db
  # Delete quota rows older than this many days on startup. Set 0 to retain all history.
  retention-days: 30

# Sound feedback for the acquisition GUI. Leave sound empty or set enabled to false to mute a trigger.
sounds:
  add:              # Increasing the sale amount (+1/+16/+64)
    enabled: true
    sound: UI_BUTTON_CLICK
    volume: 1.0
  subtract:         # Decreasing the sale amount (-1/-16/-64)
    enabled: true
    sound: UI_BUTTON_CLICK
    volume: 1.0
  success:          # Sale completed successfully
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
  failure:          # Sale failed (quota exhausted, no items, unavailable, storage/economy error, changed)
    enabled: true
    sound: ENTITY_VILLAGER_NO
    volume: 1.0

